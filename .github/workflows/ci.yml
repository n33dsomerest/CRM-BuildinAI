name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  quality:
    name: Lint, Unit Tests, Build
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: "postgresql://postgres:postgres@localhost:5432/crm_ci?schema=public"
      DIRECT_URL: "postgresql://postgres:postgres@localhost:5432/crm_ci?schema=public"
      AUTH_SECRET: "ci-only-secret-not-used-for-real-auth"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Validate Prisma schema
        run: npx prisma validate

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm test

      - name: Build
        run: npm run build

  integration:
    name: Integration Tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: crm_ci_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: "postgresql://postgres:postgres@localhost:5432/crm_ci_test?schema=public"
      DIRECT_URL: "postgresql://postgres:postgres@localhost:5432/crm_ci_test?schema=public"
      DATABASE_URL_TEST: "postgresql://postgres:postgres@localhost:5432/crm_ci_test?schema=public"
      DIRECT_URL_TEST: "postgresql://postgres:postgres@localhost:5432/crm_ci_test?schema=public"
      AUTH_SECRET: "ci-only-secret-not-used-for-real-auth"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Apply schema to test database
        run: npx prisma migrate deploy

      - name: Integration tests
        run: npx vitest run --config vitest.config.integration.mts
